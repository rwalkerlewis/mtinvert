# mtinvert configuration file
# Example: Southern California regional monitoring

# --- Paths ---
data_dir: "./data"
stationxml_path: "./stations/CI.xml"
output_dir: "./output"
gf_library_path: "./gf_library/socal_1d.h5"

# --- 1D Velocity Model (SoCal) ---
velocity_model:
  - thickness_km: 5.5
    vp_km_s: 5.5
    vs_km_s: 3.18
    rho_g_cc: 2.4
    qp: 600
    qs: 300
  - thickness_km: 10.5
    vp_km_s: 6.3
    vs_km_s: 3.64
    rho_g_cc: 2.67
    qp: 600
    qs: 300
  - thickness_km: 16.0
    vp_km_s: 6.7
    vs_km_s: 3.87
    rho_g_cc: 2.8
    qp: 600
    qs: 300
  - thickness_km: 0.0   # half-space
    vp_km_s: 7.8
    vs_km_s: 4.5
    rho_g_cc: 3.0
    qp: 1000
    qs: 500

# --- Green's Function Grid ---
distance_min_km: 10.0
distance_max_km: 300.0
distance_step_km: 5.0
depth_min_km: 1.0
depth_max_km: 25.0
depth_step_km: 1.0

# --- Waveform Processing ---
freqmin_hz: 0.02
freqmax_hz: 0.1
pre_event_sec: 30.0
post_event_sec: 150.0
taper_fraction: 0.05
snr_threshold: 3.0
water_level_db: 60.0

# --- Inversion ---
inversion_type: deviatoric   # "deviatoric" or "full"

# --- Parallel Processing ---
n_workers: 4
